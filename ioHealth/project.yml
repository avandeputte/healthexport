# XcodeGen spec. Run `xcodegen generate` in this folder to produce ioHealth.xcodeproj.
# (brew install xcodegen). Or build the project by hand; see README.
name: ioHealth
options:
  bundleIdPrefix: com.avandeputte
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 69M2JRAT8P
targets:
  ioHealth:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["*.entitlements"]
      - Shared/SyncProtocol.swift
    entitlements:
      path: iOS/ioHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: ioHealth
        NSHealthShareUsageDescription: ioHealth reads your Health data so it can be copied to your own server.
        NSHealthUpdateUsageDescription: ioHealth never writes to Health.
        NSLocalNetworkUsageDescription: ioHealth sends your Health data to your own server, which may be on your local network.
        # https everywhere, except plain http to local addresses (e.g. http://192.168.1.10:47800).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.avandeputte.healthsync.refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        # Kept from the app's old name, Health Sync: a new bundle ID would be a new app to iOS, losing the saved token,
        # sync history and Health permissions.
        PRODUCT_BUNDLE_IDENTIFIER: com.avandeputte.healthsync
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ioHealthMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes: ["*.entitlements"]
      - Shared
    # Not sandboxed: it's a personal app that writes a database and a CSV folder wherever you point it,
    # and the sandbox blocked reopening the database on relaunch (no security-scoped bookmark).
    info:
      path: Mac/Info.plist
      properties:
        NSLocalNetworkUsageDescription: ioHealth receives your Health data from your iPhone over the local network.
        NSBonjourServices: [_iohealth._tcp]
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avandeputte.healthsync.mac
        PRODUCT_NAME: ioHealth Receiver
        OTHER_LDFLAGS: -lsqlite3
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ioHealthImporter:
    type: application
    platform: macOS
    sources:
      - ExportImporter
      - Shared/SQLiteDatabase.swift
    info:
      path: ExportImporter/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avandeputte.healthexport.importer
        PRODUCT_NAME: ioHealth Importer
        OTHER_LDFLAGS: -lsqlite3
        ENABLE_APP_SANDBOX: NO
