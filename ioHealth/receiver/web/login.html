<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ioHealth · Sign in</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#e8445a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ioHealth">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body class="login">
<form method="post" action="login" class="card login-card">
  <h1><img src="favicon.svg" alt="" width="28" height="28"> ioHealth</h1>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
  <p id="failed" class="error" hidden>Wrong password.</p>
  <button type="submit">Sign in</button>
</form>
<script>
  if (location.search.includes('failed')) document.getElementById('failed').hidden = false;
</script>
</body>
</html>
