# Same as docker-compose.yml but pulls the prebuilt image from GitHub instead of building locally.
# For an always-on host: copy this file and .env there, then
#   docker compose -f docker-compose.ghcr.yml up -d
# Update later with: docker compose -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.ghcr.yml up -d
services:
  receiver:
    # latest follows main; set RECEIVER_TAG=1.0.0 (or a branch name) in .env to pin another tag.
    image: ghcr.io/avandeputte/healthexport-receiver:${RECEIVER_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "47800:47800"
    healthcheck:
      test: ["CMD", "/receiver", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
