# XcodeGen spec. Run `xcodegen generate` in this folder to produce HealthSync.xcodeproj.
# (brew install xcodegen). Or build the project by hand; see README.
name: HealthSync
options:
  bundleIdPrefix: com.avandeputte
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  HealthSync:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["*.entitlements"]
      - Shared/SyncProtocol.swift
    entitlements:
      path: iOS/HealthSync.entitlements
    info:
      path: iOS/Info.plist
      properties:
        NSHealthShareUsageDescription: Health Sync reads your Health data so it can be copied to your own Mac.
        NSHealthUpdateUsageDescription: Health Sync never writes to Health.
        NSLocalNetworkUsageDescription: Health Sync looks for the Health Sync app on your Mac over your local network.
        NSBonjourServices: [_healthsync._tcp]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avandeputte.healthsync
        TARGETED_DEVICE_FAMILY: "1"
  HealthSyncMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes: ["*.entitlements"]
      - Shared
    entitlements:
      path: Mac/HealthSyncMac.entitlements
    info:
      path: Mac/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Health Sync receives your Health data from your iPhone over the local network.
        NSBonjourServices: [_healthsync._tcp]
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avandeputte.healthsync.mac
        PRODUCT_NAME: Health Sync
        OTHER_LDFLAGS: -lsqlite3
  HealthExportImporter:
    type: application
    platform: macOS
    sources:
      - ExportImporter
      - Shared/SQLiteDatabase.swift
    info:
      path: ExportImporter/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avandeputte.healthexport.importer
        PRODUCT_NAME: Health Export Importer
        OTHER_LDFLAGS: -lsqlite3
        ENABLE_APP_SANDBOX: NO
