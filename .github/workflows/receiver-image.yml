name: Receiver image

# Builds the ioHealth server and publishes it to GitHub Container Registry as
# ghcr.io/avandeputte/iohealth. Tags: `latest` and `main-<sha>` on pushes to main,
# the branch name (with / as -) on pushes to other branches, the version on tags like v1.2.0, and `pr-<n>`
# (build only, no push) on pull requests.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "ioHealth/receiver/**"
      - ".github/workflows/receiver-image.yml"
  pull_request:
    paths:
      - "ioHealth/receiver/**"
      - ".github/workflows/receiver-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/iohealth

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ioHealth/receiver/go.mod
      - name: Test
        working-directory: ioHealth/receiver
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: ioHealth/receiver
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
